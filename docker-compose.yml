services:
  postgres:
    image: postgres:16
    env_file:
      - path: .env.local
        required: false
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env.local
        required: false
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app

  test:
    build: .
    command: pytest
    env_file:
      - path: .env.local
        required: false
    environment:
      DATABASE_URL: "sqlite:///:memory:"
    volumes:
      - .:/app

volumes:
  pgdata:
